[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karcher_home_robots"
# Versions this Python package/distribution artefact, not the HA integration
# (see manifest.json) or the Lovelace card (see www/card/constants.js).
# Intentionally divergent — do not unify.
version = "0.1.0"
description = "Home Assistant custom integration for the Kärcher RCV5 robot vacuum."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
  { name = "Victor Osadci" },
]
keywords = ["home-assistant", "hacs", "karcher", "rcv5", "vacuum"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]

# Runtime deps are duplicated in manifest.json for HACS; keep the two in sync.
# Every dep has an upper bound. Upper bounds are reviewed on dependabot PRs.
dependencies = [
  # The cloud protocol lives in karcher-home; the integration wraps it via
  # an adapter (ARCHITECTURE.md). Upper bound is bumped manually after a release
  # has been validated on hardware.
  # Pinned exact; bump requires HIL validation (ARCHITECTURE.md — upstream constraints).
  # Distribution name `karcher-home` on PyPI; import `karcher`.
  # Upstream repo: https://github.com/lafriks/python-karcher (v0.5.1, Oct 2023).
  # Bumps go through dependabot + HIL gate; see CONTRIBUTING.md Dependencies.
  "karcher-home==0.5.1",
  # aiohttp is a transitive dep of karcher-home; we pin it here because
  # we also import it directly for HA-side helpers. Floor tracks whatever
  # aiohttp the current stable HA pin below requires exactly.
  "aiohttp>=3.14.3,<4",
]

[project.optional-dependencies]
test = [
  # pytest ecosystem: exact versions are owned by phcc; don't add competing pins.
  # Cap to a single patch: phcc pins HA exactly, and intermediate phcc
  # releases track HA betas (bN). 0.13.354 is the release that pins the
  # latest stable HA (2026.8.0); 0.13.355 advances to the 2026.8.1 patch.
  # Bump both bounds together (this one and aiohttp above) to advance to
  # the next stable HA.
  "pytest-homeassistant-custom-component>=0.13.356,<0.13.357",
  "pip-audit>=2.10.1,<3",
  # Property-based tests for the pure byte parsers (decode_room_id_grid).
  # Not a phcc dep, so pin it ourselves with an upper bound.
  "hypothesis>=6.165.10,<7",
]
dev = [
  "ruff>=0.16.4,<1",
  "mypy>=2.3.1,<3",
  "pre-commit>=4.6.2,<5",
  # Used by tests/tools/check_venv.py to parse version specifiers.
  "packaging>=26.3,<27",
]
# On-request only (tests/README.md — "Mutation testing"); never installed by
# `make install` and never a CI gate. Scoped to the pure, fast modules.
mutation = [
  "mutmut>=3.7.0,<4",
]

[project.urls]
Homepage = "https://github.com/vosadci/karcher-rcv5-ha"
Issues = "https://github.com/vosadci/karcher-rcv5-ha/issues"
Changelog = "https://github.com/vosadci/karcher-rcv5-ha/blob/main/CHANGELOG.md"

[tool.setuptools]
# This is an HA custom component; there is no top-level installable package,
# but `pip install -e .[test]` pulls in the test harness.
packages = []

# -----------------------------------------------------------------------------
# Ruff — lint + format
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",          # pycodestyle + pyflakes
  "I",                    # isort
  "UP",                   # pyupgrade
  "B",                    # bugbear
  "SIM",                  # simplify
  "C4",                   # comprehensions
  "ASYNC",                # async pitfalls
  "ANN",                  # type annotations
  "RUF",                  # ruff-specific
  "S",                    # bandit (security)
  "TID",                  # tidy imports
  "T20",                  # no print
  "LOG",                  # logging discipline
  "G",                    # logging-format
  "PL",                   # pylint subset
  "PERF",                 # perf anti-patterns
]
ignore = [
  # Any — used broadly for untyped device/protobuf payloads and diagnostics
  # redaction (map_parser.py, adapter.py, diagnostics.py); not a per-line
  # noqa exemption.
  "ANN401",
  # too-many-arguments — mostly internal map_render.py geometry helpers with
  # many keyword-only params (PLR0917 already guards against transposing
  # them); HA callables rarely trip this in practice.
  "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# assert is fine in tests but must stay flagged in production code (S101 —
# assert is stripped under `python -O`).
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "PLC0415"]
"tests/tools/*.py" = ["T201", "S603", "S607", "PERF401", "PLR0912"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use aiohttp. `requests` is synchronous."
"urllib3".msg = "Use aiohttp. `urllib3` is synchronous."
"pickle".msg = "Forbidden by security policy (SEC-6)."
"marshal".msg = "Forbidden by security policy (SEC-6)."
# NB: paho.mqtt is intentionally NOT banned. `karcher-home` uses it
# internally; the integration's contract is to access MQTT only through
# the adapter, which delegates to karcher-home. The import-graph check
# enforces the boundary; a blanket ban would flag transitive imports.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# -----------------------------------------------------------------------------
# Mypy — strict on the integration package, lenient on tests
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
  "tests/fixtures/",
]

[[tool.mypy.overrides]]
module = [
  "homeassistant.*",
  "pytest_homeassistant_custom_component.*",
  "karcher",
  "karcher.*",
  "paho.*",
]
# HA, karcher-home and paho-mqtt ship partial or no stubs; allow the
# imports to resolve as Any here. The leak is contained as follows:
#   - HA: typed via stubs from pytest_homeassistant_custom_component
#     and the integration's own usage; mypy still catches misuse.
#   - karcher: imported only in `adapter.py`; client is typed as Any
#     (no py.typed upstream). Private-API access is allowlisted in
#     tests/tools/check_imports.py (see ARCHITECTURE.md).
#   - paho: never imported directly anywhere in the integration; the
#     adapter sees it only via karcher internals.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "homeassistant.components.http"
# HA 2026.8 moved StaticPathConfig into http.server and re-exports it here
# without an explicit alias, tripping --strict's implicit-reexport check
# even though it's the module's own documented public surface.
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
markers = [
  "unit: pure unit tests, no HA, no I/O",
  "contract: adapter against fakes",
  "integration: HA-loop tests via pytest-homeassistant-custom-component",
  "hardware: opt-in tests against live device (not run in CI)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pytest_homeassistant_custom_component.*",
  # Hypothesis's own threadlocal Random can be GC'd before register_random's
  # weakref check runs (upstream GC-timing quirk, unrelated to our tests).
  "ignore:It looks like .register_random. was passed an object:hypothesis.errors.HypothesisWarning",
]
timeout = 30

[tool.coverage.run]
source = ["custom_components/karcher_home_robots"]
branch = true
omit = [
  "custom_components/karcher_home_robots/__main__.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# `fail_under` is intentionally absent here. Coverage thresholds are
# graduated per project phase. The wrapper `tests/tools/coverage_gate.py`
# reads `[tool.karcher].phase` below and enforces the right thresholds.
# Per-file floors are enforced inside the wrapper, not here, because
# coverage.py's `report.fail_under` is overall-only.
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.karcher]
# Single source of truth for the active phase. Read by
# tests/tools/coverage_gate.py to pick coverage thresholds. Bumped
# in a one-line PR at phase exit.
phase = 6

# On-request only — see tests/README.md "Mutation testing". Not a CI gate.
# Mutation itself is scoped to the pure, fast modules (only_mutate) so a run
# finishes in a reasonable time on a laptop; source_paths copies the whole
# package (not just those two files) because the test suite imports the
# package as a unit and mutmut runs pytest from a copied source tree.
[tool.mutmut]
source_paths = [
  "custom_components/karcher_home_robots",
]
only_mutate = [
  "custom_components/karcher_home_robots/state.py",
  "custom_components/karcher_home_robots/map_parser.py",
]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_state_derivation.py",
  "tests/unit/test_map_parser.py",
]

[tool.coverage.html]
directory = "htmlcov"
