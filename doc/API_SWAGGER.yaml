  # ── Firmware / OTA ──────────────────────────────────────────────────────────

  /upgrade-service/firmware/tryUpgrade:
    post:
      tags: [firmware]
      summary: Check if a firmware upgrade is available (main OTA endpoint)
      description: |
        Returns the latest firmware version and download URL if an upgrade is
        available. This is the primary OTA check endpoint used by the app.

        **Confirmed request fields** (from `RobotUpgradeActivity.java` and live capture):
        - `productId` — numeric string, e.g. `"1540149850806333440"`
        - `productModelCode` — e.g. `"Kaercher.KaercherRCV5Es"`
        - `curVersionCode` — current firmware version code (`"0"` = always return latest)
        - `packageType` — `"host_fw"`
        - `username` — device serial number (SN)
        - `phoneBrand` — `"android"`

        Confirmed response includes firmware version `I3.12.26` and a CDN download URL.
      operationId: getFirmwareOtaInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareOtaReq'
      responses:
        '200':
          description: Firmware OTA info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFirmwareOtaInfo'

  /upgrade-service/app/tryUpgrade:
    post:
      tags: [firmware]
      summary: App-side OTA check (alternate endpoint)
      operationId: tryUpgradeIOT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TryUpgradeReq'
      responses:
        '200':
          description: Upgrade response
