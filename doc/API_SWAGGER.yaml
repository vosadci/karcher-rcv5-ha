openapi: 3.0.3
info:
  title: 3iRobotix / Kärcher Home Robots API
  version: "1.4.32"
  description: |
    REST API for the 3iRobotix cloud platform used by the Kärcher Home Robots app
    (package `com.kaercher.homerobots`, APK v1.4.32).

    Extracted from APK decompilation (jadx) of `KHR_1.4.32_APKPure.apk`.
    Capture date: 2026-03-28. Device under test: Kärcher RCV5.

    ## Base URLs (region-specific)
    | Region | Base URL |
    |--------|----------|
    | EU (default) | `https://eu-appaiot.3irobotix.net` |
    | US | `https://us-appaiot.3irobotix.net` |
    | CN | `https://cn-appaiot.3irobotix.net` |

    ## Authentication
    All authenticated requests require a signed Authorization header.
    The signing scheme is:
    ```
    sign = MD5(auth_token + timestamp + nonce + body_string)
    ```
    where `body_string` for POST bodies concatenates sorted keys and values
    (list/dict values must be JSON-serialised, not Python-repr'd).

    Standard request headers:
    - `Authorization: Bearer <auth_token>`
    - `tenantId: 1528983614213726208` (hardcoded for all regions)
    - `timestamp: <unix_ms>`
    - `nonce: <random_string>`
    - `sign: <md5_signature>`

    ## MQTT (non-REST)
    Robot commands and state updates travel over MQTT, not REST.
    See `PROTOCOL.md` §4–5 for MQTT topic patterns and command payloads.

    ## Notes on this document
    - Endpoint paths are extracted directly from Retrofit `@GET`/`@POST`/`@PUT`/`@DELETE`
      annotations in the decompiled source.
    - Request/response body schemas are inferred from Java bean class names and
      field names visible in the decompiled code; field types may not be exhaustive.
    - Endpoints marked **[unverified]** were found in the APK but not confirmed
      by live traffic capture.

servers:
  - url: https://eu-appaiot.3irobotix.net
    description: EU region (default for Kärcher RCV5)
  - url: https://us-appaiot.3irobotix.net
    description: US region
  - url: https://cn-appaiot.3irobotix.net
    description: CN region

tags:
  - name: auth
    description: Authentication and account management
  - name: device
    description: Device binding, status, and upgrade
  - name: family
    description: Smart-home family / home management
  - name: room
    description: Room management within a family
  - name: share
    description: Device sharing between users
  - name: content
    description: FAQ, manuals, and privacy policies
  - name: firmware
    description: OTA firmware upgrade
  - name: map
    description: Cleaning records and statistics
  - name: notification
    description: Push notification settings
  - name: storage
    description: Cloud file storage (OSS/S3)
  - name: log
    description: App and device log upload

paths:

  # ── Authentication ──────────────────────────────────────────────────────────

  /user-center/auth/login:
    post:
      tags: [auth]
      summary: Login with email + password
      operationId: loginByAccount
