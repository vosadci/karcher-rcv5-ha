      summary: Update push notification preferences
      operationId: setPushSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushReq'
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoolean'

  /jpush-service/app/record/page:
    post:
      tags: [notification]
      summary: Get paginated notification/message records for a device
      operationId: getShareDeviceMsg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonShare'
      responses:
        '200':
          description: Message record page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /jpush-service/app/share/record/page:
    post:
      tags: [notification, share]
      summary: Get paginated share notification records
      operationId: getShareMsg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonShare'
      responses:
        '200':
          description: Share message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /jpush-service/app/share/record/change/status:
    post:
      tags: [notification, share]
      summary: Mark a share notification as read/acted
      operationId: replyShareOfJpush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonShare'
      responses:
        '200':
          description: Status change result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBoolean'

  # ── Storage (OSS/S3) ─────────────────────────────────────────────────────────

  /storage-management/storage/oss/getAccessUrl:
    post:
      tags: [storage]
      summary: Get a pre-signed OSS (Alibaba Cloud) upload URL
      operationId: getOSSAccessUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOSSAccessUrlReq'
      responses:
        '200':
          description: Pre-signed URL response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /storage-management/storage/aws/getAccessUrl:
    post:
      tags: [storage]
      summary: Get a pre-signed AWS S3 upload URL
      operationId: getAWSAccessUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOSSAccessUrlReq'
      responses:
        '200':
          description: Pre-signed URL response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /storage-management/storage/oss/inner/uploadFile:
    post:
      tags: [storage]
      summary: Upload a file directly (server-side OSS proxy)
      operationId: uploadFile
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Uploaded file URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  # ── Logging ──────────────────────────────────────────────────────────────────

  /log-service/log/app/report/error:
    post:
      tags: [log]
      summary: Upload app error log
      operationId: uploadAppErrorLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAppLog'
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  /log-service/log/app/report/error/network:
    post:
      tags: [log]
      summary: Upload network configuration error log
      operationId: uploadConfigNetworkErrLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAppLog'
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  /log-service/log/app/report/config:
    post:
      tags: [log]
      summary: Upload Wi-Fi configuration step log
      operationId: uploadConfigStepLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAppLog'
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

  /log-service/log/app/report/runtime:
    post:
      tags: [log]
      summary: Upload app runtime log
      operationId: upAppRunLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAppLog'
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseString'

components:
  schemas:

    # ── Common wrappers ─────────────────────────────────────────────────────────

    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          description: "0 = success; non-zero = error code"
          example: 0
        msg:
          type: string
          example: success
        data:
          nullable: true

    ApiResponseString:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: string
              nullable: true

    ApiResponseBoolean:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: boolean
              nullable: true

    ApiResponseInteger:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: integer
              nullable: true

    ApiResponseLoginEntity:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginEntity'

    ApiResponseDeviceInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceInfo'

    ApiResponseDeviceInfoResp:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceInfoResp'

    ApiResponseDeviceList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceInfoResp'

    ApiResponseFirmwareOtaInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FirmwareOtaInfo'

    ApiResponseUserProfile:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserProfile'

    ApiResponsePrivacyList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AppPrivacyResp'

    # ── Auth / User beans ───────────────────────────────────────────────────────

    LoginReq:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Email address
          example: user@example.com
        password:
          type: string
          description: Password (plain text over HTTPS)
        token:
          type: string
          description: Existing auth token (for token-refresh login)
        tenantId:
          type: string
          default: "1528983614213726208"
        countryCode:
          type: string
          example: DE

    LoginEntity:
      type: object
      properties:
        token:
          type: string
          description: Bearer auth token for subsequent requests
        refreshToken:
          type: string
        userId:
          type: string
        username:
          type: string
        tokenExpireTime:
          type: integer
          format: int64
          description: Token expiry timestamp (Unix ms)
        mqttUsername:
          type: string
          description: MQTT client username
        mqttPassword:
          type: string
          description: MQTT client password (sensitive — never log above DEBUG)

    RegisterReq:
      type: object
      properties:
        username:
          type: string
          description: Email address
        password:
          type: string
        verCode:
          type: string
          description: Email verification code

    VerCodeReq:
      type: object
      properties:
        username:
          type: string
          description: Email address to send the code to
        type:
          type: integer
          description: "Code purpose: 1=register, 2=reset-password, etc."

    UserInfo:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        nickname:
          type: string

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
          format: uri
        country:
          type: string
        phone:
          type: string

    NicknameReq:
      type: object
      properties:
        nickname:
          type: string

    ModifyUserReq:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        verCode:
          type: string

    ModifyUserAvatarReq:
      type: object
      properties:
        url:
          type: string
          format: uri

    ModifyPwdReq:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    SaveRatingRecordReq:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    AppPrivacyResp:
      type: object
      properties:
        id:
          type: string
        langId:
          type: integer
        type:
          type: string
        url:
          type: string
          format: uri
        version:
          type: string

    # ── Device beans ────────────────────────────────────────────────────────────

    DeviceInfo:
      type: object
      properties:
        deviceId:
          type: string
          description: Cloud device ID
        sn:
          type: string
          description: Hardware serial number
        productId:
          type: string
          description: Numeric product type ID (e.g. 1540149850806333440 for RCV5)
        productModelCode:
          type: string
          example: Kaercher.KaercherRCV5Es
        nickname:
          type: string
          description: User-assigned device name
        familyId:
          type: string
        roomId:
          type: string

    DeviceInfoResp:
      allOf:
        - $ref: '#/components/schemas/DeviceInfo'
        - type: object
          properties:
            online:
              type: boolean
            bindTime:
              type: integer
              format: int64

    DevShadowReq:
      type: object
      properties:
        sns:
          type: array
          items:
            type: string
          description: List of device SNs to query

    # ── Family / Room beans ─────────────────────────────────────────────────────

    UserFamily:
      type: object
      properties:
        familyId:
          type: string
        familyName:
          type: string
        userId:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    FamilyDetail:
      allOf:
        - $ref: '#/components/schemas/UserFamily'
        - type: object
          properties:
            rooms:
              type: array
              items:
                $ref: '#/components/schemas/RoomDetail'
            devices:
              type: array
              items:
                $ref: '#/components/schemas/DeviceInfoResp'

    RoomDetail:
      type: object
      properties:
        roomId:
          type: string
        familyId:
          type: string
        roomName:
          type: string
        roomIcon:
          type: string
        sortOrder:
          type: integer

    RoomSort:
      type: object
      properties:
        familyId:
          type: string
        roomIds:
          type: array
          items:
            type: string

    RoomBindDevice:
      type: object
      properties:
        deviceId:
          type: string
        roomId:
          type: string
        familyId:
          type: string
        nickname:
          type: string

    MoveDevRoom:
      type: object
      properties:
        deviceId:
          type: string
        fromRoomId:
          type: string
        toRoomId:
          type: string
        familyId:
          type: string

    ModifyDeviceName:
      type: object
      properties:
        deviceId:
          type: string
        nickname:
          type: string
        familyId:
          type: string

    DeviceCommon:
      type: object
      properties:
        deviceIds:
          type: array
          items:
            type: string
        familyId:
          type: string

    DeviceSortOfRoom:
      type: object
      properties:
        roomId:
          type: string
        deviceIds:
          type: array
          items:
            type: string

    DelRoomBean:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string

    DevByLoactionReq:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    # ── Share beans ─────────────────────────────────────────────────────────────

    AbandonShare:
      type: object
      description: Multi-purpose share action payload
      properties:
        shareId:
          type: string
        deviceId:
          type: string
        familyId:
          type: string
        userId:
          type: string
        status:
          type: integer
          description: "Action status: 1=accept, 2=decline"
        page:
          type: integer
        pageSize:
          type: integer

    ShareDevToUser:
      type: object
      properties:
        deviceId:
          type: string
        toUsername:
          type: string
          description: Email of the user to share with

    ShareBindDevice:
      type: object
      properties:
        shareId:
          type: string
        deviceId:
          type: string

    ShareUnBindDevice:
      type: object
      properties:
        deviceId:
          type: string
        userId:
          type: string

    # ── Firmware beans ──────────────────────────────────────────────────────────

    FirmwareOtaReq:
      type: object
      description: OTA firmware check request
      required: [productId, productModelCode, username]
      properties:
        productId:
          type: string
          description: Numeric product type ID
          example: "1540149850806333440"
        productModelCode:
          type: string
          description: Product model code
          example: Kaercher.KaercherRCV5Es
        curVersionCode:
          type: string
          description: Current firmware version code. Pass "0" to always return latest.
          example: "0"
        packageType:
          type: string
          description: Firmware package type
          example: host_fw
        username:
          type: string
          description: Device serial number (SN)
        phoneBrand:
          type: string
          example: android

    FirmwareOtaInfo:
      type: object
      properties:
        version:
          type: string
          description: Firmware version string
          example: I3.12.26
        versionCode:
          type: integer
          example: 26
        downloadUrl:
          type: string
          format: uri
          description: CDN URL for the .img firmware file
        fileSize:
          type: integer
          format: int64
          description: File size in bytes
        releaseDate:
          type: string
          format: date
        updateDesc:
          type: string
          description: Release notes

    TryUpgradeReq:
      type: object
      properties:
        productId:
          type: string
        curVersionCode:
          type: string
        sn:
          type: string

    # ── Content beans ───────────────────────────────────────────────────────────

    FeedbackReq:
      type: object
      properties:
        productId:
          type: string
        page:
          type: integer
        pageSize:
          type: integer

    FeedbackRes:
      type: object
      properties:
        productId:
          type: string
        title:
          type: string
        content:
          type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri

    FeedDelReq:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string

    # ── Storage beans ───────────────────────────────────────────────────────────

    GetOSSAccessUrlReq:
      type: object
      properties:
        fileType:
          type: string
          description: "File extension, e.g. jpg, png"
        dir:
          type: string
          description: Target directory/prefix in the bucket

    # ── Push notification beans ─────────────────────────────────────────────────

    PushReq:
      type: object
      properties:
        cleanFinish:
          type: boolean
        fault:
          type: boolean
        lowBattery:
          type: boolean
        other:
          type: boolean

    PopWindowsInfoReq:
      type: object
      properties:
        productId:
          type: string
        lang:
          type: string
        version:
          type: string

    # ── Log beans ───────────────────────────────────────────────────────────────

    UploadAppLog:
      type: object
      properties:
        type:
          type: string
          description: Log category
        content:
          type: string
          description: Log text or base64-encoded data
        deviceId:
          type: string

    # ── Consumables ─────────────────────────────────────────────────────────────

    ConsumablesReq:
      type: object
      properties:
        productIds:
          type: array
          items:
            type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token obtained from the `/user-center/auth/login` endpoint.
        Must be combined with the request signing headers
        (`timestamp`, `nonce`, `sign`) for all authenticated calls.

security:
  - BearerAuth: []
