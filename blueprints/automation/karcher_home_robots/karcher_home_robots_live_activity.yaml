blueprint:
  name: Kärcher robot vacuum Live Activity
  description: >
    Show a Kärcher clean on the iPhone Lock Screen / Dynamic Island (Live Activity)
    or the Android notification shade (Live Update), and clear it once the robot
    has finished.


    The card shows the robot state and the room it is in — "Cleaning · Kitchen" —
    and switches to "Emptying" or "Locating" when the robot reports those, or
    "Offline" if it drops off the cloud. A Suction Station empty is part of the
    clean, so the card follows it through and clears afterwards.


    Requires iOS 17.2+ or Android 16+, with Live Activities enabled for Home
    Assistant in the phone settings.
  domain: automation
  source_url: https://github.com/vosadci/karcher-rcv5-ha/blob/main/blueprints/automation/karcher_home_robots/karcher_home_robots_live_activity.yaml
  homeassistant:
    min_version: "2026.9.0"
  input:
    robot:
      name: Robot
      icon: mdi:robot-vacuum
      input:
        vacuum_entity:
          name: Robot vacuum
          description: The vacuum entity of the robot to follow.
          selector:
            entity:
              filter:
                - integration: karcher_home_robots
                  domain: vacuum
    phone:
      name: Phone
      icon: mdi:cellphone
      input:
        notify_device:
          name: Phone to notify
          description: >
            The device running the Home Assistant companion app. Its notify action
            is resolved automatically.
          selector:
            device:
              filter:
                - integration: mobile_app
    options:
      name: Options
      icon: mdi:tune
      collapsed: true
      input:
        settle_time:
          name: Room settle time
          description: >
            How long a new room must persist before the card updates. The robot
            often dips into a neighbouring room and comes straight back; without a
            settle window each excursion costs two pushes, and iOS throttles
            activities that update too often.
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
        finish_hold:
          name: Hold before clearing
          description: >
            How long the robot must stay parked before the card clears. A
            Suction Station starts emptying 2-5 s after the robot lands, and
            nothing announces it in advance — this window gives it time to
            start, so the empty updates the card instead of reviving a card
            that was already cleared. Set to 0 with a plain charging dock.
          default:
            hours: 0
            minutes: 0
            seconds: 15
          selector:
            duration:
        dashboard_path:
          name: Dashboard to open on tap
          description: >
            Where tapping the card goes. A relative path opens in the app; a full
            https:// URL opens in the browser. iOS only.
          default: /lovelace/0
          selector:
            text:

mode: restart

variables:
  vacuum_entity: !input vacuum_entity
  notify_device: !input notify_device
  # The mobile_app notify action is named after the device as it was registered,
  # so the original `name` is used here, never `name_by_user`.
  notify_service: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
  # Per-robot tag, so two robots never overwrite each other's card.
  activity_tag: "{{ vacuum_entity | replace('.', '-') | replace('_', '-') }}"

triggers:
  # The explicit `to:` list matters. The vacuum entity rewrites its attributes on
  # every path push while cleaning, and a bare state trigger fires on those too —
  # which would push several times a second and burn the iOS delivery budget.
  - trigger: state
    entity_id: !input vacuum_entity
    to:
      - cleaning
      - paused
      - returning
      - docked
      - idle
      - error
      - unavailable
  # `status_label` carries the richer labels (locating, emptying) that the entity
  # state cannot express. Naming the attribute keeps this trigger narrow.
  - trigger: state
    entity_id: !input vacuum_entity
    attribute: status_label
  # The room the robot is in, mirrored onto the vacuum entity so this blueprint
  # needs no second entity picker. The coordinator already suppresses doorway
  # incursions, so the settle window here only guards the push budget.
  - trigger: state
    entity_id: !input vacuum_entity
    attribute: current_room
    for: !input settle_time

actions:
  # Collapses a room change and a state change landing together into one push.
  - delay: "00:00:03"

  # One activity per clean: it is started once and ended once, and every phase
  # in between — emptying included — is an *update* to it. Emptying is a step
  # in the cycle, not the end of it. Ending the activity mid-cycle orphans the
  # card, and the next push then has no activity to update, so it starts a new
  # one instead — observed to alert even with `silent: true` set.
  - action: "{{ notify_service }}"
    data:
      # `title` is static — it cannot change once the activity has started.
      title: >-
        {%- set dev = device_id(vacuum_entity) %}
        {{- (device_attr(dev, 'name_by_user') or device_attr(dev, 'name'))
            if dev else 'Robot vacuum' }}
      # status_label wins over the plain state when present; the room is
      # appended only when it is known and the robot is actually reachable.
      message: >-
        {%- set st = states(vacuum_entity) %}
        {%- set label = state_attr(vacuum_entity, 'status_label') %}
        {%- set room = state_attr(vacuum_entity, 'current_room') %}
        {%- set offline = st in ['unavailable', 'unknown'] %}
        {%- if offline %}Offline
        {%- elif label %}{{ label | replace('_', ' ') | title }}
        {%- else %}{{ st | title }}
        {%- endif %}
        {%- if not offline and room %} · {{ room }}
        {%- endif %}
      data:
        tag: "{{ activity_tag }}"
        live_update: true
        # Android only: stops every update re-buzzing the phone.
        alert_once: true
        # iOS. `silent` suppresses the sound on an *update*. The companion docs
        # say it has "no effect when starting the activity", which matches what
        # we saw: a push with silent set still alerted when it started one.
        # https://companion.home-assistant.io/docs/notifications/live-activities/
        # So this template only leaves loud the push it could not have silenced
        # anyway. Kept as written until the one-activity-per-clean rule above is
        # confirmed on hardware; if it holds, this collapses to `silent: true`.
        silent: >-
          {{ not (trigger is defined
                  and trigger.entity_id == vacuum_entity
                  and trigger.attribute is not defined
                  and (trigger.to_state.state if trigger.to_state is defined else '') == 'cleaning'
                  and (trigger.from_state.state if trigger.from_state is defined else '') != 'cleaning') }}
        url: !input dashboard_path
        notification_icon: mdi:robot-vacuum
        # Matches the Lovelace card palette (www/card/styles-shell-a.js):
        #   --rcv-accent #FFD400 · --rcv-card #1c1c1f · --rcv-text #e8e8ea
        # `notification_icon_color` is iOS-only; Android tints with `color`.
        notification_icon_color: "#FFD400"
        color: "#FFD400"
        background_color: "#1c1c1f"
        text_color: "#e8e8ea"

  # Mid-cycle runs stop here, leaving the card live on the phase just pushed.
  # `error` and `unavailable` are absent on purpose: a card the user needs to
  # see must not tidy itself away.
  - condition: template
    value_template: >-
      {{ states(vacuum_entity) in ['docked', 'idle']
         and state_attr(vacuum_entity, 'status_label') != 'emptying' }}

  # Parked and quiet. A Suction Station starts emptying 2-5 s after the robot
  # lands and nothing announces it in advance, so hold before clearing.
  # `mode: restart` means any trigger in this window cancels the run — an empty
  # that starts here simply takes over. This is a timeout, never a wait-for: an
  # empty that never comes costs only the hold.
  - delay: !input finish_hold

  # Re-read live state. The hold may have been outlived by a new clean, or by
  # an empty whose trigger never reached us. This condition, not `mode: restart`,
  # is what makes the clear safe.
  - condition: template
    value_template: >-
      {{ states(vacuum_entity) in ['docked', 'idle']
         and state_attr(vacuum_entity, 'status_label') != 'emptying' }}

  - action: "{{ notify_service }}"
    data:
      message: clear_notification
      data:
        tag: "{{ activity_tag }}"
