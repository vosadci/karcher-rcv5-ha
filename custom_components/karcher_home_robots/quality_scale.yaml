rules:
  # ---------------------------------------------------------------------------
  # Bronze
  # ---------------------------------------------------------------------------
  action-setup:
    status: done
    comment: Vacuum platform registers start/pause/stop/return_to_base/locate/send_command via StateVacuumEntity; no custom action registration needed.
  appropriate-polling:
    status: done
    comment: Coordinator polls every 30 s with MQTT push as primary; REST poll is fallback only.
  brands:
    status: done
    comment: brand/icon.png present in-package; served natively by HA ≥ 2026.3 (P0-12, P4-10).
  common-modules:
    status: done
    comment: coordinator.py, entity.py, const.py, adapter.py, exceptions.py, _types.py all implemented.
  config-flow:
    status: done
    comment: Three-step config flow (region → credentials → optional device picker) plus reauth implemented in config_flow.py.
  config-flow-test-coverage:
    status: done
    comment: tests/integration/test_config_flow.py covers happy path, auth failure, no-devices, multi-device, reauth.
  dependency-transparency:
    status: done
    comment: karcher-home==0.5.1 exact pin in both pyproject.toml and manifest.json requirements.
  docs-actions:
    status: done
    comment: Vacuum actions (start, pause, stop, return_to_base, locate, send_command) documented in README.md.
  docs-high-level-description:
    status: done
    comment: README.md has a plain-language description of what the integration does.
  docs-installation-instructions:
    status: done
    comment: README.md §Installation covers HACS and manual paths.
  docs-removal-instructions:
    status: done
    comment: README.md §Removal documents how to delete the integration and clean up.
  entity-event-setup:
    status: done
    comment: Coordinator subscribed to MQTT push in coordinator.async_setup(); entities use async_write_ha_state via DataUpdateCoordinator listener.
  entity-unique-id:
    status: done
    comment: All entities use {device_id}_{entity_type} unique_id scheme; frozen list tested in tests/unit/test_unique_ids.py.
  has-entity-name:
    status: done
    comment: KarcherEntity base sets _attr_has_entity_name = True; all entities inherit it.
  runtime-data:
    status: done
    comment: ConfigEntry.runtime_data holds the KarcherCoordinator; used everywhere instead of hass.data.
  test-before-configure:
    status: done
    comment: Config flow calls _try_authenticate which authenticates and fetches devices before creating the entry.
  test-before-setup:
    status: done
    comment: async_setup_entry raises ConfigEntryNotReady on adapter failure.
  unique-config-entry:
    status: done
    comment: Config flow calls async_set_unique_id(device_id) and _abort_if_unique_id_configured().

  # ---------------------------------------------------------------------------
  # Silver
  # ---------------------------------------------------------------------------
  action-exceptions:
    status: done
    comment: async_set_fan_speed, async_select_option on all select entities raise ServiceValidationError on invalid input; send_command passes through ClientError hierarchy.
  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms, calls coordinator.async_shutdown(), adapter.close().
  docs-configuration-parameters:
    status: done
    comment: Config flow field documentation (region, email, password, device) added to README.md.
  docs-installation-parameters:
    status: done
    comment: Email/password/region params documented in README.md.
  entity-unavailable:
    status: done
    comment: Entities become unavailable when coordinator.last_update_success is False (KarcherEntity._attr_available).
  integration-owner:
    status: done
    comment: "@vosadci listed in manifest.json codeowners and .github/CODEOWNERS."
  log-when-unavailable:
    status: done
    comment: Coordinator logs at WARNING on first unavailability transition (FR-OF-8, _handle_outage_start).
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES set on all platform modules (vacuum=1, sensor=0, binary_sensor=0, select=1, image=0).
  reauthentication-flow:
    status: done
    comment: Reauth flow collects password only; silent reauth with backoff (FR-A-8, FR-A-8a, FR-A-8b) in adapter.py.
  test-coverage:
    status: done
    comment: Phase-graduated gate in coverage_gate.py; 70% line / 60% branch floor enforced at Phase 3 exit.

  # ---------------------------------------------------------------------------
  # Gold
  # ---------------------------------------------------------------------------
  devices:
    status: done
    comment: DeviceInfo wired in entity.py base class; all entities grouped under the robot device.
  diagnostics:
    status: done
    comment: diagnostics.py implements async_get_config_entry_diagnostics with redaction (FR-D-1, FR-D-2); _REDACT covers password, token, nonce, email, sn, serial, mac, device_id.
  discovery:
    status: exempt
    comment: RCV5 has no LAN discovery protocol; cloud-only device with no mDNS/SSDP/ZeroConf.
  discovery-update-info:
    status: exempt
    comment: No LAN discovery; network address of the device is irrelevant to the integration.
  docs-data-update:
    status: done
    comment: README.md §Architecture documents push-first / poll-fallback update model.
  docs-examples:
    status: done
    comment: README.md §Automations has examples (start clean on schedule, notify on error).
  docs-known-limitations:
    status: done
    comment: README.md §Known limitations lists cloud-only, single-device-per-entry, no map image until Phase 5.
  docs-supported-devices:
    status: done
    comment: README.md §Supported devices lists RCV5 / RCV5 S.
  docs-supported-functions:
    status: done
    comment: README.md §Entities and actions table lists all entities and services.
  docs-troubleshooting:
    status: done
    comment: README.md §Troubleshooting covers reauth, offline robot, CA rotation.
  docs-use-cases:
    status: done
    comment: README.md §Use cases covers room cleaning via Apple Home and schedule automations.
  dynamic-devices:
    status: exempt
    comment: One RCV5 per config entry by design; no dynamic device addition at runtime.
  entity-category:
    status: done
    comment: cleaning_area and cleaning_time sensors have EntityCategory.DIAGNOSTIC.
  entity-device-class:
    status: done
    comment: Battery → SensorDeviceClass.BATTERY, error → BinarySensorDeviceClass.PROBLEM, area/time have correct device classes.
  entity-disabled-by-default:
    status: done
    comment: Water-level select has entity_registry_enabled_default=False.
  entity-translations:
    status: done
    comment: strings.json / translations/en.json populated with all entity names and states.
  exception-translations:
    status: done
    comment: Translatable error strings for reauth and config-flow errors in strings.json.
  icon-translations:
    status: todo
    comment: icons.json with entity-state icons not yet added; deferred to post-Phase-4 cleanup.
  reconfiguration-flow:
    status: todo
    comment: Reconfigure flow (change region/credentials without re-adding) not yet implemented; deferred post-Silver.
  repair-issues:
    status: done
    comment: Cloud outage repair issue (FR-OF-6/7, P4-11) and migration failure repair issue (FR-MG-5a, P4-2) implemented.
  stale-devices:
    status: exempt
    comment: One fixed device per config entry; stale-device cleanup is not applicable.

  # ---------------------------------------------------------------------------
  # Platinum
  # ---------------------------------------------------------------------------
  async-dependency:
    status: exempt
    comment: karcher-home is synchronous by design; executor dispatch in adapter.py is the accepted pattern (ARCHITECTURE.md).
  inject-websession:
    status: todo
    comment: karcher-home 0.5.1 does not expose a hook to inject aiohttp session; revisit when upstream adds support.
  strict-typing:
    status: done
    comment: mypy --strict is a blocking CI gate; py.typed marker present; no type:ignore without justification.
