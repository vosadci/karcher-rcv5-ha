default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=200"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # Vendored, minified Lit bundle — not ours to reformat (a regen would
      # reintroduce any stripped whitespace and churn the diff).
      - id: end-of-file-fixer
        exclude: ^custom_components/karcher_home_robots/www/lit-core\.js$
      - id: trailing-whitespace
        exclude: ^custom_components/karcher_home_robots/www/lit-core\.js$
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^custom_components/karcher_home_robots/www/lit-core\.js$
      - id: detect-private-key
        exclude: ^\.github/workflows/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format


  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbidden-strings
        name: forbidden-strings (APK-known passwords/hashes must not land anywhere in the repo)
        entry: 'sc2021|sc2018|hj2WtyHYYEvBTxDb|xF70lcTN|WxvqfB4a'
        language: pygrep
        types: [text]
        # These strings are no longer permitted anywhere, docs included (redacted
        # 2026-08-05 — previously doc/PROTOCOL.md carried them as findings).
        # Only this hook's own pattern definition and the mirroring CI grep step
        # need to reference them literally.
        exclude: ^(\.pre-commit-config\.yaml|\.github/)

      - id: no-debug-warnings
        name: no-debug-warnings (log format strings with arrow markers are debug leftovers)
        entry: '^\s+"[^"]*%[srdi][^"]*→'
        language: pygrep
        types: [python]

      - id: import-graph
        name: import-graph (enforce adapter / coordinator / HA layering)
        entry: python3 tests/tools/check_imports.py
        language: system
        pass_filenames: false
        files: ^custom_components/karcher_home_robots/

      - id: docs-check
        name: docs-check (links, ADR chain, ID refs, version drift)
        entry: python3 tests/tools/check_docs.py
        language: system
        pass_filenames: false
        files: \.(md|json|ya?ml|toml)$
