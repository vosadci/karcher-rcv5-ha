name: Feature request
description: Propose a new capability or behaviour.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please:
        - Check [doc/CONSTRAINTS.md §7](../../blob/main/doc/CONSTRAINTS.md) for
          what is deliberately out of scope, and search existing issues.
        - Adding support for a robot model has its own template — use
          [Add a robot model](../../issues/new?template=add_model.yml).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish? Why can't you do it today?
      placeholder: |
        I want to … but today I have to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the integration do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why they are worse.

  - type: dropdown
    id: scope-check
    attributes:
      label: Is this within scope of the integration?
      description: Local-only control, firmware changes, and map rendering are out of scope for the foreseeable future.
      options:
        - Yes, within scope
        - Not sure
        - Probably out of scope, but worth discussing
    validations:
      required: true
