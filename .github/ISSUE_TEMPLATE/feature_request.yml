name: Feature request
description: Propose a new capability or behaviour.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please:
        - Check [doc/CONSTRAINTS.md §7](../../blob/main/doc/CONSTRAINTS.md) for
          what is deliberately out of scope, and search existing issues.
        - Adding support for a robot model has its own template — use
          [Add a robot model](../../issues/new?template=add_model.yml).
        - This repo doesn't take requests over email, Telegram, Discord, or
          other private channels, and doesn't share firmware images or
          research material beyond what's already in `doc/`. Open an issue
          or a [Discussion](../../discussions) instead.

  - type: textarea
    id: homework
    attributes:
      label: What have you already read or tried?
      description: |
        Name the doc sections, README parts, or existing issues you checked,
        and what you tried on your own hardware if anything. "None" is an
        honest answer — but then say that, instead of leaving this blank.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish? Why can't you do it today?
      placeholder: |
        I want to … but today I have to …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the integration do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, and why they are worse.

  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope
      options:
        - label: I read doc/CONSTRAINTS.md §7 and this request is not on the out-of-scope list (local control, offline operation, non-RCV5 models, OTA interception, replacing the app, historical records).
          required: true
