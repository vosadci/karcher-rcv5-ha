name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m ruff check custom_components/karcher_home_robots tests
      - run: python -m ruff format --check custom_components/karcher_home_robots tests

  type:
    name: Type check (mypy --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e '.[test,dev]'
      - run: python -m mypy --strict custom_components/karcher_home_robots

  tests:
    # Pinned to the minimum supported version. "latest" is deliberately avoided:
    # green today, red tomorrow is not a useful signal. Bump on a deliberate HA
    # upgrade PR.
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deps
        # HA version is owned by pytest-homeassistant-custom-component; no
        # separate pin needed. Bumping phcc lower bound in pyproject.toml is
        # the correct way to advance the tested HA version.
        run: pip install -e '.[test]'
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=custom_components/karcher_home_robots \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing
      # Phase-graduated coverage gate. Reads [tool.karcher].phase
      # from pyproject.toml and enforces overall + per-file floors
      # per spec/06-test-strategy.md §6.1. Suspends in Phase 0.
      - name: Coverage gate (phase-graduated)
        run: |
          python tests/tools/coverage_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  imports:
    name: Import graph (adapter / coordinator / HA boundary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tests/tools/check_imports.py

  docs:
    name: Docs freshness & consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tests/tools/check_docs.py --strict

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
        # Install only our declared runtime deps — not HA or phcc, whose
        # transitive dep trees are their maintainers' responsibility to audit.
      - run: pip install "karcher-home==0.5.1" "aiohttp>=3.9,<4" pip-audit
      - name: pip-audit
        # Gating: we either believe the signal or we delete the job.
        # `|| true` was the worst of both worlds.
        # Audit only non-editable deps; the integration itself is not on PyPI.
        run: pip freeze --exclude-editable | python -m pip_audit --strict -r /dev/stdin
      - name: Secret grep
        # Scan only integration source and tests — the strings are legitimately
        # referenced in doc/, spec/, .claude/, and tooling as research findings.
        run: |
          if git grep -nE 'sc2021|hj2WtyHYYEvBTxDb|BEGIN RSA PRIVATE KEY' -- \
              'custom_components/' 'tests/'; then
            echo "Forbidden string detected"; exit 1
          fi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
